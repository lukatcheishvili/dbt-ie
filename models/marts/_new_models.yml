version: 2

models:
  - name: mart_revenue_tiers
    description: >
      Completed orders enriched with revenue tier classifications.
      Uses the classify_revenue macro to bucket total_amount into
      low/medium/high tiers with default and strict thresholds, plus
      a four-tier bonus classification.
    columns:
      - name: order_id
        description: Primary key. Unique identifier for the order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status. This model includes only completed orders.
      - name: total_amount
        description: Final order value in the order currency, including tax and shipping.
        tests:
          - is_positive
      - name: revenue_tier
        description: >
          Revenue classification using default thresholds
          (low < 100, medium < 500, high >= 500).
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: revenue_tier_strict
        description: >
          Revenue classification using stricter thresholds
          (low < 50, medium < 200, high >= 200).
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: revenue_tier_four
        description: >
          Revenue classification using four thresholds:
          bronze < 100, silver < 500, gold < 1000, platinum >= 1000.
        tests:
          - not_null
          - accepted_values:
              values: ['bronze', 'silver', 'gold', 'platinum']

  - name: mart_channel_performance
    description: >
      Website traffic performance aggregated by traffic source and device type.
      Built as a Python model from stg_website_sessions.
      Includes session counts, engagement metrics, and a channel quality classification.
    columns:
      - name: source
        description: Traffic source of the session.
        tests:
          - not_null
          - accepted_values:
              values: ['direct', 'email', 'facebook', 'google', 'instagram', 'referral']
      - name: device_type
        description: Type of device used during the session.
        tests:
          - not_null
          - accepted_values:
              values: ['desktop', 'mobile', 'tablet']
      - name: total_sessions
        description: Total number of sessions for this source and device_type combination.
        tests:
          - not_null
      - name: conversions
        description: Number of sessions that resulted in a conversion.
        tests:
          - not_null
      - name: avg_page_views
        description: Average number of pages viewed per session.
      - name: avg_duration_seconds
        description: Average session duration in seconds.
      - name: bounce_rate
        description: Percentage of bounced sessions.
      - name: conversion_rate
        description: Percentage of sessions that converted.
        tests:
          - not_null
          - is_positive
      - name: channel_quality
        description: >
          Performance classification based on conversion_rate.
          high_performing >= 10%, average >= 5%, low_performing < 5%.
        tests:
          - not_null
          - accepted_values:
              values: ['high_performing', 'average', 'low_performing']

  - name: mart_daily_sessions
    description: >
      Incremental daily website session summary by session date.
    columns:
      - name: session_day
        description: Session date. Primary key for the incremental model.
        tests:
          - unique
          - not_null
      - name: sessions
        description: Total sessions on the day.
        tests:
          - not_null
      - name: conversions
        description: Number of converted sessions on the day.
        tests:
          - not_null
      - name: conversion_rate
        description: Conversion rate for the day.
        tests:
          - not_null
      - name: unique_sources
        description: Distinct traffic sources active on the day.
        tests:
          - not_null
