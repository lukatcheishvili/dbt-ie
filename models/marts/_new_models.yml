version: 2

models:
  - name: mart_revenue_tiers
    description: >
      Completed orders enriched with revenue tier classifications.
      Uses the classify_revenue macro to bucket total_amount into
      low/medium/high tiers with two sets of thresholds — default and strict.
    columns:
      - name: order_id
        description: Primary key. Unique identifier for the order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to the customer who placed the order.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Order status. This model includes only completed orders.
      - name: total_amount
        description: Final order value in the order currency, including tax and shipping.
        tests:
          - is_positive
      - name: revenue_tier
        description: >
          Revenue classification using default thresholds (low < 100, medium < 500, high >= 500).
          Generated by the classify_revenue macro.
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']
      - name: revenue_tier_strict
        description: >
          Revenue classification using stricter thresholds (low < 50, medium < 200, high >= 200).
          Generated by the classify_revenue macro with low=50, high=200 overrides.
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high']

  - name: mart_channel_performance
    description: >
      Website traffic performance aggregated by traffic source and device type.
      Built as a Python (Pandas) model from stg_website_sessions.
      Includes session counts, engagement metrics, and a channel quality classification.
    columns:
      - name: source
        description: Traffic source of the session (e.g. google, email, direct).
        tests:
          - not_null
          - accepted_values:
              values: ['direct', 'email', 'facebook', 'google', 'instagram', 'referral']
      - name: device_type
        description: Type of device used during the session.
        tests:
          - not_null
          - accepted_values:
              values: ['desktop', 'mobile', 'tablet']
      - name: total_sessions
        description: Total number of sessions for this source and device_type combination.
      - name: conversions
        description: Number of sessions that resulted in a conversion.
      - name: avg_page_views
        description: Average number of pages viewed per session.
      - name: avg_duration_seconds
        description: Average session duration in seconds.
      - name: bounce_rate
        description: Percentage of sessions where the user left without interacting (bounced).
      - name: conversion_rate
        description: Percentage of sessions that converted. Calculated as conversions / total_sessions * 100.
        tests:
          - not_null
          - is_positive
      - name: channel_quality
        description: >
          Performance classification based on conversion_rate.
          high_performing >= 10%, average >= 5%, low_performing < 5%.
        tests:
          - not_null